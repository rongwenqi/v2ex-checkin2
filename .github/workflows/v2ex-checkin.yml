name: V2EX 每日签到

on:
  schedule:
    # UTC 06:17 = 北京时间 14:17，避开每天 08:00 刷新前后。
    # GitHub 排队可能导致实际签到延后，任务到达后仍正常执行。
    - cron: '17 6 * * *'
  workflow_dispatch:

concurrency:
  group: v2ex-daily
  cancel-in-progress: false

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install requests

      - name: 运行离线测试
        run: python -m unittest -v

      - name: 随机延迟
        if: github.event_name == 'schedule'
        run: |
          DELAY=$((RANDOM % 60))
          echo "随机延迟 $DELAY 秒，计划触发时间为北京时间 14:17"
          sleep $DELAY

      - name: 执行签到
        env:
          V2EX_COOKIE: ${{ secrets.V2EX_COOKIE }}
          V2EX_ACCOUNTS: ${{ secrets.V2EX_ACCOUNTS }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python v2ex_checkin.py
